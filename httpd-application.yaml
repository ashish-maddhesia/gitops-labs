apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: httpd
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ashish-maddhesia/gitops-labs.git
    targetRevision: main
    path: apps/httpd

  destination:
    server: https://kubernetes.default.svc
    namespace: development

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
